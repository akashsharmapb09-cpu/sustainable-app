name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Link audit, lint, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit internal routes and assets
        run: pnpm run qa:links

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm run build
