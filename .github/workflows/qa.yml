name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Next.js build, routes and responsive browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.34.6
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Export resolved pnpm lockfile for release
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Audit internal routes and assets
        run: pnpm run qa:links
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Install Chromium for browser QA
        run: pnpm exec playwright install --with-deps chromium
      - name: Responsive, direct-route and auth smoke tests
        run: pnpm run qa:browser
