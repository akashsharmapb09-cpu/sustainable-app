name: QA

on:
  push:
    branches: [main, "feat/greenswap-nextjs-app-router"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, route audit, lint, browser QA, production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript checks
        run: npm run typecheck
      - name: Audit routes, assets, and internal links
        run: npm run qa:links
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Direct-route, demo-auth, and responsive smoke tests
        run: npm run qa:browser
